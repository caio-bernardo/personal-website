title = "Digital Twin Chat"
description = """A distributed microservice architecture utilizing a digital twin approach to monitor, evaluate and simulate prototype conversational agents. Developed as part of an academic research, the systems combines Python and LangChain ecosystem to mirror chatbot behaviors in real-time and evalutes using process mining techniques of classification. I architected the core infrastructure to provide isolated environments for automated evaluation, tracking and testing of LLM-driven agents."""
url = "https://github.com/caio-bernardo/dt-chat"
emoji = "🤖"
date = "2025-2026"
status = "Active"
tags = ["python", "langchain", "microservices", "digital twin", "docker", "LLMOps"]

