# Projects Collection
# Each project can have the following fields:
#   title       - Project name (required)
#   description - Brief description
#   url         - Link to project (external URL or internal path)
#   image       - Image filename (relative to this folder)
#   emoji       - Emoji icon displayed before title
#   date        - Date or date range (e.g., "2024" or "2023-2024")
#   status      - Current status (e.g., "Active", "Completed", "Archived")
#   tags        - List of tags/technologies

# TIP: try to describe projects with: 1. what it's 2. techstack 3. what you solved 4. what was the result

[[projects]]
title = "Dragonite"
description = """A federated, multi-party chat server built with Go that implements the Matrix Protocol specification. The architecture utilizes Postgres for persistent event storage, Redis for low-latency cache and trasaction validation, and MinIO for scalable object storage. It supports interoperability with existing Matrix clients (i.e. Element.io), allowing users to participate in chat rooms across the Matrix federation network. Acted as scrum master and implemented state resolution algorithm to synchronize chat histories across federated servers."""
url = "https://github.com/caio-bernardo/dragonite"
emoji = "💬"
date = "2026"
status = "Active"
tags = ["go", "distributed systems", "postgresql", "redis"]

