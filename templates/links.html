{% extends 'base.html' %} {% block main %}
<hgroup>
    <h1>{{page.title}}</h1>
    <p>{{page.description}}</p>
</hgroup>

<div class="container">
    {% for link in page.extra.links %}
    <a href="{{link.url}}" rel="me" aria-label="{{ link.name | capitalize }}">
        <article class="icon-card">
            {{ icons::icon(name=link.name) }}
            <p>{{link.name}}</p>
        </article>
    </a>
    {% endfor %}
</div>
{% endblock main %}
