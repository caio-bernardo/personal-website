{% extends "base.html" %} {% block main %} {% set taxonomy =
get_taxonomy(kind=taxonomy.name, lang=lang) %}

<h1>{{ taxonomy.name }}</h1>

<ul>
    {% for term in taxonomy.items %}
    <li>
        <a href="{{ term.permalink }}">{{ term.name }}</a>
        ({{ term.pages | length }})
    </li>
    {% endfor %}
</ul>

{% endblock main %}
