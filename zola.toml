# The URL the site will be built for
base_url = "https://caiobernardo.top"

title = "Caio's Website"
author = "Caio Bernardo"
description = "Caio Bernardo's personal website and blog. See information about me or read some posts."

default_language = "en"

minify_html = true

generate_feeds = true
# Whether to build a search index to be used later on by a JavaScript library
build_search_index = false
# Whether to automatically compile all Sass files in the sass directory
compile_sass = true


taxonomies = [
    {name = "tags", feed=true},
    {name = "publish-year", feed=true}
]


[markdown]
render_emoji = true
github_alerts = true
bottom_footnotes = true

[markdown.highlighting]
theme = "kanagawa-wave"

[languages.pt-br]
title = "Caio Bernardo"
generate_feeds = true
taxonomies = [
    {name = "tags", feed=true},
    {name = "publish-year", feed=true}
]

[languages.pt-br.translations]
summary = "Blog de Caio Bernardo"
description = "Site pessoal de Caio Bernardo. Veja informações sobre mim ou leia alguns posts."

[extra]
# Put all your custom variables here
license = "CC BY-SA 4.0 License"
