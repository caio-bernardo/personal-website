# Site title.
title = "caio-bernardo"
# Site description.
description = "Caio Bernardo's personal website, blog and portfolio."
# Base URL for your site.
base_url = "https://caiobernardo.top"
# Default author of pages
author = "Caio Bernardo (me@caiobernardo.top)"
# No SASS - CSS is internal (located in base.html template).
compile_sass = true
# Search index enabled.
build_search_index = true
# Minify html
minify_html = true
# Default site language.
default_language = "en"
# Feeds.
generate_feeds = true
# Specify feed filenames.
feed_filenames = ["atom.xml", "rss.xml"]
# Taxonomies.
taxonomies = [{ name = "tags", feed = true }]

[search]
# Required for search page to work.
index_format = "fuse_javascript"
# include title pf page/section in the index search
include_title = true
# include description of page in index search
include_description = true
# include datetime of page in the index search
include_date = true
# Include pages contents to the search
include_content = true

[markdown]
# use unicode emojis in markdown :smile:
render_emoji = true
# enable smart pontuation (dashes, quotes, dots)
smart_punctuation = true
# footnotes at the bottom of the page
bottom_footnotes = true
# github/admonition callouts, ex.: > [!tip]
github_alerts = true

[markdown.highlighting]
# return error on undefined languages
error_on_missing_language = true
# Use inline css to specify code highlighting
style = "inline"
# Specify the hl themes for light and dark modes
theme = "kanagawa-wave"

[slugify]
# Controls slugification for page/section URLs.
paths = "on"
# Controls slugification for taxonomy terms (tags, categories, etc.).
taxonomies = "on"
# Controls slugification for heading anchors (H1 to H6 etc.).
anchors = "on"

[extra]
# Keywords for SEO.
keywords = "portfolio, blog, tech"
# Site icon in header (optional - comment out to hide).
site_icon = "quill.svg"
# Header strapline (optional - comment out to hide).
strapline = "Personal website and portfolio"
# Footer text (optional - comment out to hide).
footer_text = "caiobernardo - made in <a href='https://getzola.org'>Zola</a>"
# Favicon (optional - comment out to hide).
favicon = "/favicon.ico"
# Profile picture on home page (optional - comment out to hide).
profile_picture = "/images/profile.jpg"

# Enable inline SVG icons (uses sprite sheet).
inline_icons = true
icon_path = "static/icons/"
icons = ["light", "asleep", "rss", "email", "github", "lattes", "linkedin", "mastodon"]

# Responsive images
image_format = "auto"
image_quality = 80
images_default_size = 1024
images_sizes = [512, 1024, 2048]

# Navigation menu.
menu_links = [
  { url = "$BASE_URL/", name = "Home" },
  { url = "$BASE_URL/posts/", name = "Posts" },
  { url = "$BASE_URL/about/", name = "About" },
  { url = "$BASE_URL/projects/", name = "Projects" },
  { url = "$BASE_URL/links/", name = "Links" },
  { url = "$BASE_URL/tags/", name = "Tags" },
  { url = "$BASE_URL/search/", name = "Search" },
]

# Custom colour themes. Adjust here to apply own colour.
# NOTE: Austere Light colours.
[extra.colours.light]
background = "#FAF7F2"
text = "#1a1a1a"
text_muted = "#3a3a3a"
accent = "#9E4440"
accent_hover = "#7A3533"
code_bg = "#f0ebe3"
border = "#e0d9ce"

# NOTE: Austere Dark colours.
[extra.colours.dark]
background = "#141413"
text = "#e8e8e8"
text_muted = "#a0a0a0"
accent = "#E07A5F"
accent_hover = "#F4A594"
code_bg = "#1e1e1d"
border = "#2a2a29"

